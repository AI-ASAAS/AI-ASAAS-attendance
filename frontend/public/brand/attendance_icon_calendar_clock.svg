<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgCal" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#2d2929"/>
      <stop offset="100%" stop-color="#181616"/>
    </radialGradient>
    <linearGradient id="goldCal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c98e"/>
      <stop offset="50%" stop-color="#ba9555"/>
      <stop offset="100%" stop-color="#997435"/>
    </linearGradient>
  </defs>

  <!-- Background App Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgCal)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#goldCal)" stroke-width="2" opacity="0.35"/>

  <!-- Calendar Container (تقويم الدوام وسجل الحضور) -->
  <g transform="translate(100, 95)">
    <!-- Binder Rings / Pegs -->
    <rect x="70" y="-18" width="18" height="36" rx="9" fill="url(#goldCal)"/>
    <rect x="224" y="-18" width="18" height="36" rx="9" fill="url(#goldCal)"/>

    <!-- Calendar Backing Card -->
    <rect width="312" height="295" rx="32" fill="#242121" stroke="#fcf9f5" stroke-width="5"/>

    <!-- Calendar Gold Top Banner (شريط التقويم الذهبي) -->
    <path d="M 0 32 C 0 14 14 0 32 0 L 280 0 C 298 0 312 14 312 32 L 312 68 L 0 68 Z" fill="url(#goldCal)"/>

    <!-- Asaas Diamond Pin in Header -->
    <rect x="148" y="26" width="16" height="16" rx="3" fill="#221f1f" transform="rotate(45 156 34)"/>

    <!-- Calendar Days Grid (صفوف أيام الدوام) -->
    <!-- Row 1 -->
    <circle cx="65" cy="115" r="9" fill="#fcf9f5" opacity="0.9"/>
    <circle cx="125" cy="115" r="9" fill="#fcf9f5" opacity="0.9"/>
    <circle cx="185" cy="115" r="9" fill="#fcf9f5" opacity="0.9"/>
    <circle cx="245" cy="115" r="9" fill="url(#goldCal)"/>

    <!-- Row 2 -->
    <circle cx="65" cy="170" r="9" fill="#fcf9f5" opacity="0.9"/>
    <circle cx="125" cy="170" r="9" fill="url(#goldCal)"/>
    <circle cx="185" cy="170" r="9" fill="#fcf9f5" opacity="0.9"/>
    <circle cx="245" cy="170" r="9" fill="#fcf9f5" opacity="0.4"/>

    <!-- Row 3 -->
    <circle cx="65" cy="225" r="9" fill="url(#goldCal)"/>
    <circle cx="125" cy="225" r="9" fill="#fcf9f5" opacity="0.9"/>
  </g>

  <!-- Big Clock & Checkmark Punch-in Emblem (ساعة الدوام وتأكيد الحضور) -->
  <g transform="translate(325, 335)">
    <!-- Clock Outer Rim with Depth -->
    <circle cx="0" cy="0" r="88" fill="#1d1b1b" stroke="url(#goldCal)" stroke-width="7"/>
    <circle cx="0" cy="0" r="74" fill="#242121" stroke="#fcf9f5" stroke-width="2" opacity="0.3"/>

    <!-- Clock Hour Marks -->
    <circle cx="0" cy="-56" r="4.5" fill="url(#goldCal)"/>
    <circle cx="56" cy="0" r="4.5" fill="url(#goldCal)"/>
    <circle cx="0" cy="56" r="4.5" fill="url(#goldCal)"/>
    <circle cx="-56" cy="0" r="4.5" fill="url(#goldCal)"/>

    <!-- Clock Hands (08:00 Attendance) -->
    <line x1="0" y1="0" x2="-32" y2="18" stroke="#fcf9f5" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="-42" stroke="url(#goldCal)" stroke-width="5" stroke-linecap="round"/>
    <!-- Center Pivot Pin -->
    <circle cx="0" cy="0" r="8" fill="url(#goldCal)"/>
    <circle cx="0" cy="0" r="3.5" fill="#1d1b1b"/>

    <!-- Floating Green/Gold Checkmark Capsule (شارة إتمام التحضير) -->
    <g transform="translate(48, 48)">
      <circle cx="0" cy="0" r="36" fill="#1d1b1b" stroke="url(#goldCal)" stroke-width="4.5"/>
      <circle cx="0" cy="0" r="28" fill="url(#goldCal)"/>
      <path d="M -12 1 L -4 9 L 12 -7" fill="none" stroke="#221f1f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
