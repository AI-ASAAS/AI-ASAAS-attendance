<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2d2929"/>
      <stop offset="100%" stop-color="#191717"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2bf7d"/>
      <stop offset="50%" stop-color="#ba9555"/>
      <stop offset="100%" stop-color="#916f34"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.3"/>

  <!-- Asaas Hexagonal Outer Brackets (الأساس) -->
  <!-- Top Left Bracket -->
  <path d="M 230 84 L 140 136 L 140 216 L 175 216 L 175 156 L 230 124 Z" fill="#fcf9f5"/>
  <!-- Top Right Bracket -->
  <path d="M 282 84 L 372 136 L 372 216 L 337 216 L 337 156 L 282 124 Z" fill="#fcf9f5"/>
  <!-- Bottom Left Bracket -->
  <path d="M 140 296 L 140 376 L 230 428 L 230 388 L 175 356 L 175 296 Z" fill="#fcf9f5"/>
  <!-- Bottom Right Bracket -->
  <path d="M 372 296 L 372 376 L 282 428 L 282 388 L 337 356 L 337 296 Z" fill="#fcf9f5"/>

  <!-- Asaas Brand Lattice Arcs (الترابط) -->
  <!-- Arcs from points to center -->
  <path d="M 256 166 Q 220 200 210 256" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 256 166 Q 292 200 302 256" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 256 346 Q 220 312 210 256" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 256 346 Q 292 312 302 256" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Outer connection arcs -->
  <path d="M 256 166 Q 190 170 175 216" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.8"/>
  <path d="M 256 166 Q 322 170 337 216" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.8"/>
  <path d="M 256 346 Q 190 342 175 296" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.8"/>
  <path d="M 256 346 Q 322 342 337 296" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.8"/>

  <!-- 4 Intelligence Diamond Stars (الذكاء) -->
  <!-- Top Star -->
  <path d="M 256 150 L 263 166 L 279 166 L 266 176 L 271 192 L 256 182 L 241 192 L 246 176 L 233 166 L 249 166 Z" fill="url(#goldGrad)"/>
  <!-- Bottom Star -->
  <path d="M 256 330 L 263 346 L 279 346 L 266 356 L 271 372 L 256 362 L 241 372 L 246 356 L 233 346 L 249 346 Z" fill="url(#goldGrad)"/>
  <!-- Left Star -->
  <path d="M 166 240 L 172 256 L 188 256 L 175 266 L 180 282 L 166 272 L 152 282 L 157 266 L 144 256 L 160 256 Z" fill="url(#goldGrad)"/>
  <!-- Right Star -->
  <path d="M 346 240 L 352 256 L 368 256 L 355 266 L 360 282 L 346 272 L 332 282 L 337 266 L 324 256 L 340 256 Z" fill="url(#goldGrad)"/>

  <!-- Central Attendance Core: Diamond Dial with Precision Clock Hands (النواة وحوكمة الزمن) -->
  <g transform="translate(256, 256)">
    <!-- Central Rhombus Core -->
    <rect x="-44" y="-44" width="88" height="88" rx="16" fill="#1e1c1c" stroke="url(#goldGrad)" stroke-width="4.5" transform="rotate(45)"/>
    <!-- Subtle Hour Marks -->
    <circle cx="0" cy="-30" r="2.5" fill="#e2bf7d"/>
    <circle cx="30" cy="0" r="2.5" fill="#e2bf7d"/>
    <circle cx="0" cy="30" r="2.5" fill="#e2bf7d"/>
    <circle cx="-30" cy="0" r="2.5" fill="#e2bf7d"/>
    <!-- Precision Clock Hands (Set at 08:00 Attendance Moment) -->
    <!-- Hour Hand -->
    <line x1="0" y1="0" x2="-16" y2="10" stroke="#fcf9f5" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Minute Hand -->
    <line x1="0" y1="0" x2="0" y2="-22" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Center Pivot Pin -->
    <circle cx="0" cy="0" r="4.5" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="2" fill="#1e1c1c"/>
  </g>
</svg>
