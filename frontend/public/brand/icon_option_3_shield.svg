<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad3" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2d2929"/>
      <stop offset="100%" stop-color="#191717"/>
    </radialGradient>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2bf7d"/>
      <stop offset="50%" stop-color="#ba9555"/>
      <stop offset="100%" stop-color="#916f34"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad3)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#goldGrad3)" stroke-width="2" opacity="0.3"/>

  <!-- Sovereign Security Shield (مستوحى مباشرة من أيقونة Security في صفحة 09) -->
  <g transform="translate(256, 256)">
    <!-- Outer Shield Contour -->
    <path d="M 0 -170 C 85 -170 145 -145 155 -135 C 165 -60 160 50 120 120 C 85 170 20 205 0 215 C -20 205 -85 170 -120 120 C -160 50 -165 -60 -155 -135 C -145 -145 -85 -170 0 -170 Z" 
          fill="#221f1f" stroke="url(#goldGrad3)" stroke-width="7" stroke-linejoin="round"/>
    
    <!-- Inner Glass Inset Shield -->
    <path d="M 0 -148 C 70 -148 120 -128 128 -120 C 136 -55 132 40 98 100 C 68 142 16 172 0 180 C -16 172 -68 142 -98 100 C -132 40 -136 -55 -128 -120 C -120 -128 -70 -148 0 -148 Z" 
          fill="#1b1818" stroke="#fcf9f5" stroke-width="2" opacity="0.35"/>

    <!-- Biometric Fingerprint Ridges (البصمة الحيوية لمنع التحضير بالنيابة) -->
    <path d="M 0 -95 C 40 -95 65 -70 65 -30 C 65 30 45 75 0 95 C -45 75 -65 30 -65 -30 C -65 -70 -40 -95 0 -95" 
          fill="none" stroke="url(#goldGrad3)" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M 0 -70 C 25 -70 42 -52 42 -22 C 42 22 28 55 0 70 C -28 55 -42 22 -42 -22 C -42 -52 -25 -70 0 -70" 
          fill="none" stroke="#fcf9f5" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Asaas Central Sovereign Rhombus (النواة والتقييد بالأجهزة المعتمدة) -->
    <rect x="-30" y="-30" width="60" height="60" rx="12" fill="#242121" stroke="url(#goldGrad3)" stroke-width="5" transform="rotate(45)"/>

    <!-- Lock Keyhole / Device Binding Emblem -->
    <circle cx="0" cy="-6" r="8" fill="url(#goldGrad3)"/>
    <path d="M -5 -4 L 5 -4 L 7 12 L -7 12 Z" fill="url(#goldGrad3)"/>
    <circle cx="0" cy="-6" r="3.5" fill="#242121"/>

    <!-- 4 Satellite Asaas Diamond Star Pins -->
    <path d="M 0 -128 L 5 -118 L 15 -118 L 7 -110 L 10 -100 L 0 -106 L -10 -100 L -7 -110 L -15 -118 L -5 -118 Z" fill="url(#goldGrad3)"/>
    <path d="M 0 148 L 5 158 L 15 158 L 7 166 L 10 176 L 0 170 L -10 176 L -7 166 L -15 158 L -5 158 Z" fill="url(#goldGrad3)"/>
    <path d="M -95 10 L -90 20 L -80 20 L -88 28 L -85 38 L -95 32 L -105 38 L -102 28 L -110 20 L -100 20 Z" fill="url(#goldGrad3)"/>
    <path d="M 95 10 L 100 20 L 110 20 L 102 28 L 105 38 L 95 32 L 85 38 L 88 28 L 80 20 L 90 20 Z" fill="url(#goldGrad3)"/>
  </g>
</svg>
