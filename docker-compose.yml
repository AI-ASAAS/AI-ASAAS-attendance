name: asas

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asas-backend
    restart: always
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      SQLITE_PATH: /app/database/asas.db
      QR_SECRET: ${QR_SECRET:-9989c9183fbb75956504d4abf7cd869e927c173b4d93a7fbe11626e43cb7d5f4}
      WEB_ORIGIN: "*"
      NODE_ENV: production
      APP_URL: ${APP_URL:-https://attendance.ai-asaas.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-331442639841-s48n1ir37vnn9nckg6ogn1hv8fl9fiq3.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-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}
    volumes:
      - ./database:/app/database
      - ./backups:/app/backups
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asas-frontend
    restart: always
    environment:
      API_INTERNAL_URL: http://backend:5000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend

  caddy:
    image: caddy:alpine
    container_name: asas-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - asas_caddy_data:/data
      - asas_caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  asas_caddy_data:
  asas_caddy_config:
