name: asas

services:
  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: asas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: asas
    volumes:
      - asas_pgdata:/var/lib/postgresql
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d asas"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asas-backend
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/asas
      DB_SSL: "false"
      QR_SECRET: 9989c9183fbb75956504d4abf7cd869e927c173b4d93a7fbe11626e43cb7d5f4
      WEB_ORIGIN: "*"
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asas-frontend
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:5000
      NODE_ENV: production
    ports:
      - "3000:3000"
      - "80:3000"
    depends_on:
      - backend

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: asas-tunnel
    restart: unless-stopped
    command: tunnel --url http://frontend:3000
    depends_on:
      - frontend

volumes:
  asas_pgdata:
