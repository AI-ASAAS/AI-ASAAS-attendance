services:
  - type: web
    name: ai-asaas-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/asas-server.js
    disk:
      name: asas-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: HOST
        value: 0.0.0.0
      - key: SQLITE_PATH
        value: /data/asas.db
      - key: QR_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: "*"
